name: keep-alive

# Render 免费实例 15 分钟无访问会休眠，冷启动 30-60 秒。
# 本工作流每 5 分钟访问一次 /healthz，让实例保持唤醒。
# 注意：公共仓库的 Actions 免费不限分钟；GitHub 会停用 60 天无提交仓库的定时工作流，
#       若发现保活失效，在 Actions 页手动 "Enable workflow" 即可。
# 若需正式的宕机告警/状态页，可另配 UptimeRobot 等监控（同样探测 /healthz）。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping 玄机小筑 /healthz
        run: |
          set -u
          url="https://xuanji-xiaozhu.onrender.com/healthz"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url" || true)
            echo "attempt $i: HTTP ${code:-000}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::玄机小筑不可达（3 次重试均失败）"
          exit 1
